plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// The emote wheel + armor mod is built as its own subproject (it uses Mojang names, this mod uses Yarn
// names) and nested inside the final jar, so you still get ONE jar to install.
configurations {
	nestedJars {
		transitive = false
	}
}

dependencies {
	nestedJars project(':emote-wheel')
}

remapJar {
	nestedJars.from configurations.nestedJars
}

processResources {
	def modVersion = project.version
	def emoteVersion = project.emote_wheel_version
	inputs.property "version", modVersion
	inputs.property "emoteVersion", emoteVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}
